[versions]

core-ktx           = "1.7.0"
compose            = "1.4.0"
material3          = "1.3.2"
lifecycle-runtime  = "2.3.1"
activity-compose   = "1.3.1"
serialization-json = "1.3.0"
navigation-compose = "2.5.3"
junit              = "4.13.2"
test-ext-junit     = "1.1.4"
espresso           = "3.5.0"
agp           = "8.9.1"
kotlin        = "1.8.0"
secrets       = "2.0.1"

[libraries]
core-ktx                 = { group = "androidx.core",             name = "core-ktx",            version.ref = "core-ktx" }
compose-ui               = { group = "androidx.compose.ui",       name = "ui",                  version.ref = "compose" }
compose-material3        = { group = "androidx.compose.material3",name = "material3",           version.ref = "material3" }
compose-ui-tooling-preview = { group = "androidx.compose.ui",     name = "ui-tooling-preview",  version.ref = "compose" }
lifecycle-runtime-ktx    = { group = "androidx.lifecycle",       name = "lifecycle-runtime-ktx", version.ref = "lifecycle-runtime" }
activity-compose         = { group = "androidx.activity",        name = "activity-compose",    version.ref = "activity-compose" }
kotlinx-serialization    = { group = "org.jetbrains.kotlinx",    name = "kotlinx-serialization-json", version.ref = "serialization-json" }
navigation-compose       = { group = "androidx.navigation",      name = "navigation-compose",  version.ref = "navigation-compose" }
junit                    = { group = "junit",                   name = "junit",               version.ref = "junit" }
test-ext-junit           = { group = "androidx.test.ext",       name = "junit",               version.ref = "test-ext-junit" }
espresso-core            = { group = "androidx.test.espresso",   name = "espresso-core",       version.ref = "espresso" }
compose-ui-test-junit4   = { group = "androidx.compose.ui",      name = "ui-test-junit4",      version.ref = "compose" }
compose-ui-tooling       = { group = "androidx.compose.ui",      name = "ui-tooling",          version.ref = "compose" }
compose-ui-test-manifest = { group = "androidx.compose.ui",      name = "ui-test-manifest",    version.ref = "compose" }

[plugins]
android-app        = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library",     version.ref = "agp" }
kotlin-android     = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
secrets-gradle     = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "secrets" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }